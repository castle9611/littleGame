<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼图小游戏</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="main-container">
            <div class="image-container" id="canvasContainer"></div>
        </div>
    </div>
    <div class="mask tip-page"></div>
    <div class="tip-container tip-page">
        <div class="tip-box">
                <div class="btn-container">
                    <button type="button" class="btn" id="downloadImgBtn" title="下载完整原图">下载图片</button>
                    <button type="button" class="btn" id="okBtn">确定</button>
            </div>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <h4>游戏设置</h4>
        <div class="sidebar-content">
            <div class="sidebar-controls">
                <h5>难度选择</h5>
                <div class="control-group">
                    <label>行数：</label>
                    <select id="yNumber">
                        <option value="3" selected>3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>列数：</label>
                    <select id="xNumber">
                        <option value="3" selected>3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>
                <div class="button-group">
                    <button type="button" class="sidebar-btn" id="startBtn"><i class="fas fa-redo"></i> 重新开始</button>
                    <button type="button" class="sidebar-btn" id="autoSolveBtn"><i class="fas fa-magic"></i> 一键拼好</button>
                </div>
            </div>
            
            <h5>图片链接</h5>
            <p><a href="#" target="_blank" data-url="https://imgapi.cn/api.php">三次元</a></p>
            <p><a href="#" target="_blank" data-url="https://imgapi.cn/cos.php">COSPLAY</a></p>
            <p><a href="#" target="_blank" data-url="https://imgapi.cn/api.php?fl=dongman&gs=images">二次元</a></p>
            <p><a href="#" target="_blank" data-url="https://imgapi.cn/bing.php?rand=true">必应随机</a></p>
            <p><a href="#" target="_blank" data-url="https://www.dmoe.cc/random.php">樱花</a></p>
            <p><a href="#" target="_blank" data-url="https://api.btstu.cn/sjbz/api.php">搏天三次元</a></p>
            <p><a href="#" target="_blank" data-url="https://api.anosu.top/img">二次元</a></p>
            <p><a href="#" target="_blank" data-url="https://imgapi.cn/api.php?zd=mobile&fl=meizi&gs=images">手机妹子</a></p>
            <p><a href="#" target="_blank" data-url="https://imgapi.cn/api.php?zd=mobile&fl=fengjing&gs=images">手机风景</a></p>
            <p><a href="#" target="_blank" data-url="https://imgapi.cn/api.php?zd=mobile&fl=suiji&gs=images">手机随机</a></p>
            <p><a href="#" target="_blank" data-url="https://imgapi.cn/api.php?zd=mobile&fl=dongman&gs=images">手机动漫</a></p>
        </div>
    </div>
<script>
let container = document.getElementById('canvasContainer');
let yNumberElement = document.getElementById('yNumber');
let xNumberElement = document.getElementById('xNumber');
let tipPage = document.querySelectorAll('div.tip-page');
let imageUrlInput = document.getElementById('imageUrl'); // 保留变量以防其他地方引用（虽然已移除输入框）
let maskElement = document.querySelector('.mask.tip-page');
let lastImageOriginUrl = ''; // 记录当前拼图所用的原始图片地址（不带时间戳）
let lastImageLoadedUrl = ''; // 记录浏览器实际加载的最终图片地址（可能为跳转后的真实 URL）
let lastImageBlobUrl = '';   // 缓存当前图片的 Blob 对象 URL，下载时优先使用
let currentImageElement = null; // 保存当前显示的图片对象，下载时优先使用
// 尝试解析跳转后的最终图片 URL（若跨域不允许，可能失败）
async function resolveFinalUrl(url) {
    try {
        const res = await fetch(url, { redirect: 'follow' });
        if (res.ok) {
            // 若有跳转，res.url 为最终地址；若无跳转则为原地址
            return res.url || url;
        }
    } catch { /* 忽略错误，回退原地址 */ }
    return url;
}
// 尝试抓取图片 Blob 并缓存对象 URL（可能受 CORS 限制）
async function cacheImageBlob(url) {
    try {
        const res = await fetch(url, { redirect: 'follow' });
        if (!res.ok) throw new Error('network');
        const blob = await res.blob();
        // 释放旧的对象 URL
        if (lastImageBlobUrl) {
            try { URL.revokeObjectURL(lastImageBlobUrl); } catch {}
        }
        lastImageBlobUrl = URL.createObjectURL(blob);
        console.log('✓ 图片 Blob 缓存成功，下载时将使用缓存版本');
    } catch (error) {
        // 如果缓存失败，清空 Blob URL，避免下载旧图片
        console.log('⚠ 图片 Blob 缓存失败（可能是跨域限制），下载时将使用原始 URL');
        if (lastImageBlobUrl) {
            try { URL.revokeObjectURL(lastImageBlobUrl); } catch {}
        }
        lastImageBlobUrl = '';
    }
}

let finished = false;

init();

document.getElementById('startBtn').addEventListener('click', function () {
    // 重新开始时应重置为本地图片，而不是使用之前选择的 API
    init(null); // 传入 null 确保使用默认本地图片
});

document.getElementById('autoSolveBtn').addEventListener('click', function () {
    autoSolve();
});

document.getElementById('okBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    e.preventDefault();
    hidenTip();
});

const downloadBtnEl = document.getElementById('downloadImgBtn');
if (downloadBtnEl) {
    downloadBtnEl.addEventListener('click', function () {
        // 下载拼好的拼图截图
        downloadPuzzleImage();
    });
}

// 下载拼图截图
function downloadPuzzleImage() {
    const container = document.getElementById('canvasContainer');
    if (!container || !container.children.length) {
        alert('当前没有可下载的拼图');
        return;
    }
    
    // 检查是否有已加载的图片
    if (!currentImageElement) {
        alert('图片还未加载完成，请稍后重试');
        return;
    }
    
    try {
        // 获取原始图片尺寸
        const img = currentImageElement;
        const imgWidth = img.naturalWidth || img.width;
        const imgHeight = img.naturalHeight || img.height;
        
        // 创建canvas（使用原始图片尺寸以保证质量）
        const canvas = document.createElement('canvas');
        canvas.width = imgWidth;
        canvas.height = imgHeight;
        const ctx = canvas.getContext('2d');
        
        // 直接绘制完整图片
        ctx.drawImage(img, 0, 0, imgWidth, imgHeight);
        
        // 转换为Blob并下载
        canvas.toBlob(blob => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'puzzle-completed.png';
            a.click();
            URL.revokeObjectURL(url);
            console.log('✓ 拼图截图下载成功');
        }, 'image/png');
    } catch (error) {
        console.error('下载拼图失败:', error);
        alert('下载失败，请稍后重试');
    }
}

function init(imageUrl) {
    let xNumber = xNumberElement.options[xNumberElement.selectedIndex].value; // 列数
    let yNumber = yNumberElement.options[yNumberElement.selectedIndex].value; // 行数
    let itemList = [];
    let order = 0;
    let img = null;
    let cellWidth, cellHeight, imageCellWidth, imageCellHeight;
    container.innerHTML = ''; // 清空容器
    finished = false;
    
    // 清空旧的图片缓存信息（除非使用同一图片）
    // 这样可以避免下载时使用旧图片的缓存
    if (lastImageBlobUrl) {
        try { URL.revokeObjectURL(lastImageBlobUrl); } catch {}
        lastImageBlobUrl = '';
    }
    currentImageElement = null;

    getRotateImage(imageUrl).then((image) => {
        img = image;
        // 保存当前图片对象，供下载时使用
        currentImageElement = image;
        
        let fixedHeight = 580;
        let imageWidth = img.width;
        let imageHeight = img.height;
        let scaledWidth, scale;

        // 使用固定高度
        scale = fixedHeight / imageHeight;
        scaledWidth = Math.floor(imageWidth * scale);

        // 计算每个单元格的宽高（根据缩放后的尺寸）
        cellWidth = Math.floor(scaledWidth / xNumber);
        cellHeight = Math.floor(fixedHeight / yNumber);

        // 更新容器的宽度和高度
        // 无论是否全屏，都需要设置容器尺寸以便grid布局正确工作
        container.style.width = `${scaledWidth}px`;
        container.style.height = `${fixedHeight}px`;

        // 计算图片在每个单元格中显示的部分尺寸
        imageCellWidth = Math.floor(img.width / xNumber);
        imageCellHeight = Math.floor(img.height / yNumber);

        // 使用 grid 布局
        container.style['grid-template-columns'] = `repeat(${xNumber}, ${cellWidth}px)`;
        container.style['grid-template-rows'] = `repeat(${yNumber}, ${cellHeight}px)`;

        for (let j = 0; j < yNumber; j++) {
            itemList[j] = [];
            for (let i = 0; i < xNumber; i++) {
                initCube(i, j);
            }
        }
        moveCube();
    });

    function initCube(i, j) {
        let item = document.createElement('div');
        item.className = 'item';
        item.setAttribute('data-index', order);
        item.draggable = 'true';
        // 使用 drag.js 中的函数添加拖动事件监听器
        attachDragListeners(item);
        item.innerHTML = "<canvas class='' width='" + cellWidth + "' height='" + cellHeight + "'></canvas>";
        itemList[j][i] = item;

        let canvas = item.querySelector('canvas');
        let ctx = canvas.getContext('2d');

        // 将图片的指定区域绘制到 canvas 上
        ctx.drawImage(
            img,
            i * imageCellWidth, j * imageCellHeight, // 图片的起点位置
            imageCellWidth, imageCellHeight,        // 图片区域大小
            0, 0,                                   // 画布的起点
            cellWidth, cellHeight                   // 画布显示的大小
        );
        order++;
    }

    function moveCube() {
        let randomChange = [-1, 1];
        const changeCount = 5;
        for (let j = 0; j < yNumber; j++) {
            const maxIndex = xNumber - 1;
            for (let m = 0; m < changeCount; m++) {
                let sourceIndex = getRandomInt(xNumber);
                let targetIndex = getTargetIndex(sourceIndex, maxIndex);
                itemList[j][sourceIndex] = itemList[j].splice(targetIndex, 1, itemList[j][sourceIndex])[0];
            }
        }
        for (let i = 0; i < xNumber; i++) {
            const maxIndex = yNumber - 1;
            for (let m = 0; m < changeCount; m++) {
                let sourceIndex = getRandomInt(yNumber);
                let targetIndex = getTargetIndex(sourceIndex, maxIndex);
                itemList[sourceIndex][i] = itemList[targetIndex].splice(i, 1, itemList[sourceIndex][i])[0];
            }
        }
        for (let j = 0; j < itemList.length; j++) {
            for (let i = 0; i < itemList[j].length; i++) {
                itemList[j][i].setAttribute('data-x', i);
                itemList[j][i].setAttribute('data-y', j);
                container.appendChild(itemList[j][i]);
            }
        }

        function getTargetIndex(sourceIndex, maxIndex) {
            return sourceIndex === 0 ? 1 : sourceIndex === maxIndex ? maxIndex - 1 : sourceIndex + randomChange[getRandomInt(randomChange.length)];
        }
    }
}

function loadImagesFromTxt(txtUrl) {
    return fetch(txtUrl)
        .then(response => response.text())
        .then(text => {
            // 假设 txt 文件中每一行都是一个图片链接
            let imageUrls = text.split('\n').map(line => line.trim()).filter(line => line);
            return imageUrls;
        })
        .catch(error => {
            console.error("无法获取 txt 文件：", error);
            return [];
        });
}

let currentImageIndex = 0;  // 用于追踪当前显示的图片索引

// 辅助函数：正确添加查询参数到URL（处理已有查询参数的情况）
function addQueryParam(url, paramName, paramValue) {
    const separator = url.includes('?') ? '&' : '?';
    return `${url}${separator}${paramName}=${paramValue}`;
}

function getRotateImage(imageUrl) {
    let image = new Image();
    // 设置跨域属性，允许 canvas 操作外部图片
    image.crossOrigin = "anonymous";
    // 如果提供了URL参数且不为null，则使用；否则使用默认本地图片
    // imageUrl 为 null 或 undefined 时，使用默认本地图片
    let inputUrl = (imageUrl !== null && imageUrl !== undefined) ? imageUrl.trim() : '';

    if (inputUrl && inputUrl.startsWith("txt:")) {
        // 处理 txt 文件链接
        let txtUrl = inputUrl.replace("txt:", "");
        return loadImagesFromTxt(txtUrl).then(imageUrls => {
            if (imageUrls.length > 0) {
                // 确保当前索引不超出范围
                currentImageIndex = (currentImageIndex + 1) % imageUrls.length;
                let imageUrl = imageUrls[currentImageIndex];
                
                // 记录原始地址，并添加时间戳和随机数以防缓存
                lastImageOriginUrl = imageUrl;
                let timestamp = new Date().getTime();
                let randomNum = Math.random().toString(36).substring(7);
                let urlWithTimestamp = addQueryParam(addQueryParam(imageUrl, 'timestamp', timestamp), 'rand', randomNum);
                // 先尝试解析最终 URL（避免再次命中随机 API）
                resolveFinalUrl(urlWithTimestamp).then(finalUrl => {
                    image.src = finalUrl;
                });
                return new Promise((resolve, reject) => {
                    image.onload = () => {
                        // 记录最终地址；若解析失败则用 currentSrc/带时间戳的地址
                        lastImageLoadedUrl = image.currentSrc || urlWithTimestamp;
                        // 图片加载成功后，尝试缓存 Blob 对象 URL（若跨域允许）
                        cacheImageBlob(lastImageLoadedUrl);
                        resolve(image);
                    };
                    image.onerror = reject;
                });
            } else {
                return Promise.reject("在 txt 文件中未找到图像。");
            }
        });
    } else {
        // 如果不是 txt 文件，直接使用图片 URL（如果没有提供或为 null/undefined，则使用默认本地图片）
        let imageUrl = inputUrl || './img/demo.jpg';
        // 记录原始地址，并添加时间戳和随机数以防缓存（确保每次获取不同图片，特别是随机API）
        lastImageOriginUrl = imageUrl;
        let timestamp = new Date().getTime();
        let randomNum = Math.random().toString(36).substring(7);
        // 使用辅助函数正确添加参数（处理URL已包含查询参数的情况）
        let urlWithTimestamp = addQueryParam(addQueryParam(imageUrl, '_t', timestamp), '_r', randomNum);
        // 先尝试解析最终 URL 并赋值
        resolveFinalUrl(urlWithTimestamp).then(finalUrl => {
            image.src = finalUrl;
        });
        // 注意：最终地址在 onload 中通过 currentSrc 记录
        return new Promise((resolve, reject) => {
            image.onload = () => {
                // 记录最终地址；若解析失败则用 currentSrc/带时间戳的地址
                lastImageLoadedUrl = image.currentSrc || urlWithTimestamp;
                // 图片加载成功后，尝试缓存 Blob 对象 URL（若跨域允许）
                cacheImageBlob(lastImageLoadedUrl);
                resolve(image);
            };
            image.onerror = reject;
        });
    }
}

function loadImagesFromTxt(txtUrl) {
    return fetch(txtUrl)
        .then(response => response.text())
        .then(text => {
            // 假设 txt 文件中每一行都是一个图片链接
            return text.split('\n').map(line => line.trim()).filter(line => line);
        })
        .catch(error => {
            console.error("Failed to fetch txt file:", error);
            return [];
        });
}

// 拖动相关代码已移动到 drag.js

function getRandomInt(max) {
    return Math.floor(Math.random() * max);
}

function showTip() {
    // 显示提示层
    for (let i = 0; i < tipPage.length; i++) {
        tipPage[i].style.display = 'block';
    }
    // 确保按钮容器和按钮都可见
    const btnContainer = document.querySelector('.tip-box .btn-container');
    const downloadBtn = document.getElementById('downloadImgBtn');
    const okBtn = document.getElementById('okBtn');
    if (btnContainer) {
        btnContainer.style.display = 'flex';
        btnContainer.style.visibility = 'visible';
        btnContainer.style.opacity = '1';
    }
    if (downloadBtn) {
        downloadBtn.style.display = 'inline-block';
        downloadBtn.style.visibility = 'visible';
        downloadBtn.style.opacity = '1';
    }
    if (okBtn) {
        okBtn.style.display = 'inline-block';
        okBtn.style.visibility = 'visible';
        okBtn.style.opacity = '1';
    }
    // 触发礼花动画
    launchConfetti();
}

// 添加遮罩层点击关闭功能
if (maskElement) {
    maskElement.addEventListener('click', function(e) {
        // 如果点击的是遮罩本身（不是提示框），则关闭
        if (e.target === maskElement) {
            hidenTip();
        }
    });
}

function hidenTip() {
    for (let i = 0; i < tipPage.length; i++) {
        tipPage[i].style.display = 'none';
    }
    // 清理礼花画布
    const existing = document.getElementById('confettiCanvas');
    if (existing && existing.parentNode) {
        existing.parentNode.removeChild(existing);
    }
    // 重置完成状态，允许继续游戏
    finished = false;
}

function isFinish() {
    for (let i = 0; i < container.childNodes.length; i++) {
        if (container.childNodes[i].dataset.index != i) {
            return false;
        }
    }
    finished = true;
    return true;
}

// 一键拼好功能：自动将所有拼图碎片按正确顺序排列
function autoSolve() {
    if (finished) {
        alert('拼图已经完成了！');
        return;
    }
    
    // 获取所有拼图碎片
    const items = Array.from(container.childNodes);
    
    // 获取网格尺寸
    let xNumber = parseInt(xNumberElement.options[xNumberElement.selectedIndex].value);
    let yNumber = parseInt(yNumberElement.options[yNumberElement.selectedIndex].value);
    
    // 按照 data-index 对碎片进行排序
    items.sort((a, b) => {
        return parseInt(a.dataset.index) - parseInt(b.dataset.index);
    });
    
    // 清空容器
    container.innerHTML = '';
    
    // 按正确的顺序重新添加碎片，并更新它们的位置数据
    items.forEach((item, index) => {
        const x = index % xNumber;
        const y = Math.floor(index / xNumber);
        item.setAttribute('data-x', x);
        item.setAttribute('data-y', y);
        container.appendChild(item);
    });
    
    // 标记为完成
    finished = true;
    
    // 触发完成动画
    setTimeout(() => {
        showTip();
    }, 300);
}

        const sidebar = document.getElementById('sidebar');
        const tooltip = document.getElementById('tooltip');

        // Toggle sidebar expansion on mouseover and mouseout
        sidebar.addEventListener('mouseover', () => sidebar.classList.add('expanded'));
        sidebar.addEventListener('mouseout', () => sidebar.classList.remove('expanded'));

        // Handle auto-load image from sidebar links
        document.querySelectorAll('.sidebar-content a').forEach(link => {
            link.addEventListener('click', event => {
                event.preventDefault();
                const url = link.getAttribute('data-url');
                
                // 自动加载图片并重新初始化游戏
                init(url);
                
                // 显示加载提示
                tooltip.textContent = '正在加载图片...';
                        tooltip.classList.add('show');
                        setTimeout(() => tooltip.classList.remove('show'), 2000);
            });
        });

        // 礼花动画：创建画布并发射粒子
        function launchConfetti() {
            // 如果已存在则先移除
            const old = document.getElementById('confettiCanvas');
            if (old && old.parentNode) old.parentNode.removeChild(old);

            const canvas = document.createElement('canvas');
            canvas.id = 'confettiCanvas';
            canvas.style.position = 'fixed';
            canvas.style.inset = '0';
            canvas.style.pointerEvents = 'none';
            canvas.style.zIndex = '1002';
            document.body.appendChild(canvas);

            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            function resize() {
                canvas.width = Math.floor(window.innerWidth * dpr);
                canvas.height = Math.floor(window.innerHeight * dpr);
            }
            resize();
            window.addEventListener('resize', resize, { once: true });

            const colors = ['#ff5252','#ff9800','#ffd740','#69f0ae','#40c4ff','#7c4dff','#e040fb'];
            const gravity = 0.08 * dpr;
            const drag = 0.995;
            const count = Math.min(180, Math.floor(window.innerWidth / 6));
            const centerX = (canvas.width / 2);
            const centerY = (canvas.height * 2 / 3); // 起点更靠下，使礼花向上喷出

            const particles = [];
            for (let i = 0; i < count; i++) {
                const angle = -Math.PI + (Math.random() * Math.PI); // 上半圆（-π 到 0），向上方向
                const speed = (Math.random() * 12 + 8) * dpr;
                particles.push({
                    x: centerX,
                    y: centerY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 6 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * Math.PI * 2,
                    vr: (Math.random() - 0.5) * 0.2
                });
            }

            let start = null;
            function tick(ts) {
                if (!start) start = ts;
                const elapsed = ts - start;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.vy += gravity;
                    p.vx *= drag; p.vy *= drag;
                    p.x += p.vx; p.y += p.vy;
                    p.rotation += p.vr;

                    // 绘制小矩形纸片
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size/2, -p.size/3, p.size, p.size * 0.66);
                    ctx.restore();
                });

                // 1.6 秒后移除
                if (elapsed < 1600) {
                    requestAnimationFrame(tick);
                } else {
                    if (canvas && canvas.parentNode) {
                        canvas.parentNode.removeChild(canvas);
                    }
                }
            }
            requestAnimationFrame(tick);
        }
</script>
    <script src="drag.js"></script>
</body>
</html>
