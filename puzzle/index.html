// 尝试解析跳转后的最终图片 URL（若跨域不允许，可能失败）
async function resolveFinalUrl(url) {
    try {
        const res = await fetch(url, { redirect: 'follow' });
        if (res.ok) {
            // 若有跳转，res.url 为最终地址；若无跳转则为原地址
            return res.url || url;
        }
    } catch { /* 忽略错误，回退原地址 */ }
    return url;
}

// 下载拼图截图 - 手动重绘canvas避免跨域限制
async function downloadPuzzleImage() {
    const container = document.getElementById('canvasContainer');
    if (!container || !container.children.length) {
        alert('当前没有可下载的拼图');
        return;
    }
    
    // 检查是否有已加载的图片
    if (!currentImageElement) {
        alert('图片还未加载完成，请稍后重试');
        return;
    }
    
    console.log('📸 正在生成拼图图片...');
    
    // 检查是否是跨域模式
    if (!isImageCorsEnabled) {
        console.log('⚠ 检测到跨域图片，直接复制拼图块的canvas（绕过跨域限制）');
        
        // 关键发现：虽然原始图片是跨域的，但是拼图块的canvas已经被绘制了
        // 我们可以直接读取这些canvas并重新组合成完整图片！
        // canvas.drawImage(anotherCanvas) 不受跨域限制！
        try {
            // 获取容器尺寸
            const containerRect = container.getBoundingClientRect();
            const width = Math.floor(containerRect.width);
            const height = Math.floor(containerRect.height);
            
            console.log(`容器尺寸: ${width}x${height}`);
            
            // 创建新canvas用于合成
            const outputCanvas = document.createElement('canvas');
            outputCanvas.width = width * 2; // 2倍提高清晰度
            outputCanvas.height = height * 2;
            const ctx = outputCanvas.getContext('2d');
            ctx.scale(2, 2);
            
            // 背景色
            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(0, 0, width, height);
            
            // 获取所有拼图块
            const pieces = Array.from(container.querySelectorAll('.item'));
            console.log(`找到 ${pieces.length} 个拼图块`);
            
            if (pieces.length === 0) {
                alert('没有找到拼图块，请先开始游戏');
                return;
            }
            
            let successCount = 0;
            for (const piece of pieces) {
                const pieceCanvas = piece.querySelector('canvas');
                if (!pieceCanvas) continue;
                
                // 获取拼图块相对于容器的位置
                const pieceRect = pieceCanvas.getBoundingClientRect();
                const x = pieceRect.left - containerRect.left;
                const y = pieceRect.top - containerRect.top;
                
                try {
                    // 关键：canvas.drawImage(另一个canvas) 不受跨域限制！
                    // 即使源图片是跨域的，canvas元素本身可以被复制
                    ctx.drawImage(pieceCanvas, x, y);
                    successCount++;
                } catch (err) {
                    console.warn('绘制拼图块失败:', err);
                }
            }
            
            console.log(`✓ 成功绘制 ${successCount}/${pieces.length} 个拼图块`);
            
            // 导出图片
            outputCanvas.toBlob((blob) => {
                if (!blob) {
                    alert('生成图片失败');
                    return;
                }
                
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'puzzle-completed.png';
                a.click();
                URL.revokeObjectURL(url);
                console.log('✅ 拼图图片下载成功（canvas复制方案）');
            }, 'image/png', 1.0);
            
        } catch (error) {
            console.error('处理失败:', error);
            alert(`⚠️ 下载失败：${error.message}

✅ 建议：使用"上传图片"按钮选择本地图片`);
        }
        return;
    }
    
    // CORS图片，可以直接使用canvas绘制
    try {
        // 获取容器尺寸
        const containerRect = container.getBoundingClientRect();
        const width = Math.floor(containerRect.width);
        const height = Math.floor(containerRect.height);
        
        // 创建新canvas手动绘制
        const canvas = document.createElement('canvas');
        canvas.width = width * 2; // 2倍提高清晰度
        canvas.height = height * 2;
        const ctx = canvas.getContext('2d');
        ctx.scale(2, 2);
        
        // 背景色
        ctx.fillStyle = '#f0f0f0';
        ctx.fillRect(0, 0, width, height);
        
        // 遍历所有拼图块（每个拼图块是一个.item，里面有canvas）
        const pieces = Array.from(container.querySelectorAll('.item'));
        console.log(`找到 ${pieces.length} 个拼图块`);
        
        if (pieces.length === 0) {
            alert('没有找到拼图块，请先开始游戏');
            return;
        }
        
        let drawnCount = 0;
        for (const piece of pieces) {
            // 获取拼图块内的canvas
            const pieceCanvas = piece.querySelector('canvas');
            if (!pieceCanvas) {
                console.warn('拼图块没有canvas:', piece);
                continue;
            }
            
            // 获取拼图块的位置（相对于容器）
            const pieceRect = piece.getBoundingClientRect();
            const x = pieceRect.left - containerRect.left;
            const y = pieceRect.top - containerRect.top;
            
            try {
                // 直接绘制拼图块的canvas到大canvas上
                ctx.drawImage(pieceCanvas, x, y);
                drawnCount++;
            } catch (err) {
                console.warn('绘制拼图块失败:', err, piece);
            }
        }
        
        console.log(`成功绘制 ${drawnCount} 个拼图块`);
        
        // 导出并下载
        const dataUrl = canvas.toDataURL('image/png', 1.0);
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = 'puzzle-completed.png';
        a.click();
        
        console.log('✓ 拼图图片下载成功');
        
    } catch (error) {
        console.error('生成图片失败:', error);
        alert('生成图片失败：' + error.message);
    }
}

// 直接下载图片URL（用于非CORS图片）
async function downloadImageDirectly() {
    const downloadUrl = lastImageLoadedUrl || lastImageOriginUrl;
    if (!downloadUrl) {
        alert('无法获取图片下载链接');
        return;
    }
    
    try {
        console.log('📥 正在下载图片...', downloadUrl);
        
        // 尝试通过fetch下载（可能会失败如果CORS不允许）
        try {
            const response = await fetch(downloadUrl);
            if (response.ok) {
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'puzzle-image.jpg';
                a.click();
                URL.revokeObjectURL(url);
                console.log('✓ 图片下载成功（通过fetch）');
                return;
            }
        } catch (fetchError) {
            console.log('⚠ Fetch下载失败，尝试直接链接下载');
        }
        
        // 如果fetch失败，直接创建链接下载
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = 'puzzle-image.jpg';
        a.target = '_blank'; // 在新标签页打开，用户可以手动保存
        a.click();
        console.log('✓ 已打开图片链接（请手动保存）');
        
        // 显示提示
        const tooltip = document.getElementById('tooltip');
        if (tooltip) {
            tooltip.textContent = '图片已在新标签页打开，请右键保存';
            tooltip.classList.add('show');
            setTimeout(() => tooltip.classList.remove('show'), 3000);
        }
    } catch (error) {
        console.error('下载失败:', error);
        alert('下载失败，请尝试右键保存图片');
    }
}

function init(imageUrl) {
    let xNumber = xNumberElement.options[xNumberElement.selectedIndex].value; // 列数
    let yNumber = yNumberElement.options[yNumberElement.selectedIndex].value; // 行数
    let itemList = [];
    let order = 0;
    let img = null;
    let cellWidth, cellHeight, imageCellWidth, imageCellHeight;
    container.innerHTML = ''; // 清空容器
    finished = false;
    
    // 清空旧的图片缓存信息（除非使用同一图片）
    // 这样可以避免下载时使用旧图片的缓存
    if (lastImageBlobUrl) {
        try { URL.revokeObjectURL(lastImageBlobUrl); } catch {}
        lastImageBlobUrl = '';
    }
    currentImageElement = null;
    isImageCorsEnabled = true; // 重置CORS标记（默认假设支持）

    getRotateImage(imageUrl).then((image) => {
        img = image;
        // 保存当前图片对象，供下载时使用
        currentImageElement = image;
        
        // 显示成功提示
        const tooltip = document.getElementById('tooltip');
        if (tooltip) {
            tooltip.textContent = '图片加载成功！';
            tooltip.classList.add('show');
            setTimeout(() => tooltip.classList.remove('show'), 2000);
        }
        
        let fixedHeight = 580;
        let imageWidth = img.width;
        let imageHeight = img.height;
        let scaledWidth, scale;

        // 使用固定高度
        scale = fixedHeight / imageHeight;
        scaledWidth = Math.floor(imageWidth * scale);

        // 计算每个单元格的宽高（根据缩放后的尺寸）
        cellWidth = Math.floor(scaledWidth / xNumber);
        cellHeight = Math.floor(fixedHeight / yNumber);

        // 更新容器的宽度和高度
        // 无论是否全屏，都需要设置容器尺寸以便grid布局正确工作
        container.style.width = `${scaledWidth}px`;
        container.style.height = `${fixedHeight}px`;

        // 计算图片在每个单元格中显示的部分尺寸
        imageCellWidth = Math.floor(img.width / xNumber);
        imageCellHeight = Math.floor(img.height / yNumber);

        // 使用 grid 布局
        container.style['grid-template-columns'] = `repeat(${xNumber}, ${cellWidth}px)`;
        container.style['grid-template-rows'] = `repeat(${yNumber}, ${cellHeight}px)`;

        for (let j = 0; j < yNumber; j++) {
            itemList[j] = [];
            for (let i = 0; i < xNumber; i++) {
                initCube(i, j);
            }
        }
        moveCube();
    }).catch((error) => {
        // 图片加载失败时的处理
        console.error('图片加载失败:', error);
        const tooltip = document.getElementById('tooltip');
        if (tooltip) {
            tooltip.textContent = '图片加载失败，请尝试其他图片源';
            tooltip.classList.add('show');
            setTimeout(() => tooltip.classList.remove('show'), 3000);
        }
        // 如果是首次加载失败，使用默认图片
        if (!currentImageElement) {
            console.log('尝试加载默认图片...');
            init(null); // 使用默认本地图片
        }
    });

    function initCube(i, j) {
        let item = document.createElement('div');
        item.className = 'item';
        item.setAttribute('data-index', order);
        item.draggable = 'true';
        // 使用 drag.js 中的函数添加拖动事件监听器
        attachDragListeners(item);
        item.innerHTML = "<canvas class='' width='" + cellWidth + "' height='" + cellHeight + "'></canvas>";
        itemList[j][i] = item;

        let canvas = item.querySelector('canvas');
        let ctx = canvas.getContext('2d');

        // 将图片的指定区域绘制到 canvas 上
        ctx.drawImage(
            img,
            i * imageCellWidth, j * imageCellHeight, // 图片的起点位置
            imageCellWidth, imageCellHeight,        // 图片区域大小
            0, 0,                                   // 画布的起点
            cellWidth, cellHeight                   // 画布显示的大小
        );
        order++;
    }

    function moveCube() {
        let randomChange = [-1, 1];
        const changeCount = 5;
        for (let j = 0; j < yNumber; j++) {
            const maxIndex = xNumber - 1;
            for (let m = 0; m < changeCount; m++) {
                let sourceIndex = getRandomInt(xNumber);
                let targetIndex = getTargetIndex(sourceIndex, maxIndex);
                itemList[j][sourceIndex] = itemList[j].splice(targetIndex, 1, itemList[j][sourceIndex])[0];
            }
        }
        for (let i = 0; i < xNumber; i++) {
            const maxIndex = yNumber - 1;
            for (let m = 0; m < changeCount; m++) {
                let sourceIndex = getRandomInt(yNumber);
                let targetIndex = getTargetIndex(sourceIndex, maxIndex);
                itemList[sourceIndex][i] = itemList[targetIndex].splice(i, 1, itemList[sourceIndex][i])[0];
            }
        }
        for (let j = 0; j < itemList.length; j++) {
            for (let i = 0; i < itemList[j].length; i++) {
                itemList[j][i].setAttribute('data-x', i);
                itemList[j][i].setAttribute('data-y', j);
                container.appendChild(itemList[j][i]);
            }
        }

        function getTargetIndex(sourceIndex, maxIndex) {
            return sourceIndex === 0 ? 1 : sourceIndex === maxIndex ? maxIndex - 1 : sourceIndex + randomChange[getRandomInt(randomChange.length)];
        }
    }
}

function loadImagesFromTxt(txtUrl) {
    return fetch(txtUrl)
        .then(response => response.text())
        .then(text => {
            // 假设 txt 文件中每一行都是一个图片链接
            let imageUrls = text.split('\n').map(line => line.trim()).filter(line => line);
            return imageUrls;
        })
        .catch(error => {
            console.error("无法获取 txt 文件：", error);
            return [];
        });
}

let currentImageIndex = 0;  // 用于追踪当前显示的图片索引

// 辅助函数：正确添加查询参数到URL（处理已有查询参数的情况）
function addQueryParam(url, paramName, paramValue) {
    const separator = url.includes('?') ? '&' : '?';
    return `${url}${separator}${paramName}=${paramValue}`;
}

function getRotateImage(imageUrl) {
    // 如果提供了URL参数且不为null，则使用；否则使用默认本地图片
    // imageUrl 为 null 或 undefined 时，使用默认本地图片
    let inputUrl = (imageUrl !== null && imageUrl !== undefined) ? imageUrl.trim() : '';

    if (inputUrl && inputUrl.startsWith("txt:")) {
        // 处理 txt 文件链接
        let txtUrl = inputUrl.replace("txt:", "");
        return loadImagesFromTxt(txtUrl).then(imageUrls => {
            if (imageUrls.length > 0) {
                // 确保当前索引不超出范围
                currentImageIndex = (currentImageIndex + 1) % imageUrls.length;
                let imageUrl = imageUrls[currentImageIndex];
                
                // 记录原始地址，并添加时间戳和随机数以防缓存
                lastImageOriginUrl = imageUrl;
                let timestamp = new Date().getTime();
                let randomNum = Math.random().toString(36).substring(7);
                let urlWithTimestamp = addQueryParam(addQueryParam(imageUrl, 'timestamp', timestamp), 'rand', randomNum);
                
                return tryLoadImage(urlWithTimestamp);
            } else {
                return Promise.reject("在 txt 文件中未找到图像。");
            }
        });
    } else {
        // 如果不是 txt 文件，直接使用图片 URL（如果没有提供或为 null/undefined，则使用默认本地图片）
        let imageUrl = inputUrl || './img/demo.jpg';
        // 记录原始地址，并添加时间戳和随机数以防缓存（确保每次获取不同图片，特别是随机API）
        lastImageOriginUrl = imageUrl;
        let timestamp = new Date().getTime();
        let randomNum = Math.random().toString(36).substring(7);
        // 使用辅助函数正确添加参数（处理URL已包含查询参数的情况）
        let urlWithTimestamp = addQueryParam(addQueryParam(imageUrl, '_t', timestamp), '_r', randomNum);
        
        return tryLoadImage(urlWithTimestamp);
    }
}

// 尝试加载图片，优先使用fetch缓存方案避免跨域问题
async function tryLoadImage(url) {
    console.log('🔄 尝试加载图片:', url);
    
    // 方案1：尝试通过 fetch 获取图片数据并转为 blob URL
    // 这样创建的图片完全没有跨域限制！
    try {
        console.log('📥 尝试通过 fetch 下载图片数据...');
        const response = await fetch(url, {
            mode: 'cors',
            credentials: 'omit',
            cache: 'default'
        });
        if (response.ok) {
            const blob = await response.blob();
            // 释放旧的 blob URL
            if (lastImageBlobUrl) {
                try { URL.revokeObjectURL(lastImageBlobUrl); } catch {}
            }
            // 创建新的 blob URL
            lastImageBlobUrl = URL.createObjectURL(blob);
            console.log('✓ 图片数据下载成功，创建 Blob URL');
            
            // 使用 blob URL 加载图片（完全无跨域问题）
            const image = new Image();
            return new Promise((resolve, reject) => {
                image.onload = () => {
                    console.log('✓ 图片加载成功（Blob模式，无跨域限制）');
                    lastImageLoadedUrl = lastImageBlobUrl;
                    currentImageElement = image;
                    isImageCorsEnabled = true; // Blob URL 没有跨域限制
                    resolve(image);
                };
                image.onerror = () => {
                    console.error('✗ Blob URL 图片加载失败');
                    reject(new Error('Blob URL 图片加载失败'));
                };
                image.src = lastImageBlobUrl;
            });
        }
    } catch (fetchError) {
        console.log('⚠ Fetch 下载失败，尝试传统加载方式...', fetchError.message);
    }
    
    // 方案2：fetch 失败时，尝试带 crossOrigin 的传统加载
    try {
        const image = new Image();
        image.crossOrigin = "anonymous";
        
        return await new Promise((resolve, reject) => {
            let resolved = false;
            
            image.onload = () => {
                if (resolved) return;
                resolved = true;
                console.log('✓ 图片加载成功（CORS模式）');
                lastImageLoadedUrl = image.currentSrc || url;
                currentImageElement = image;
                isImageCorsEnabled = true;
                resolve(image);
            };
            
            image.onerror = () => {
                if (resolved) return;
                resolved = true;
                console.log('⚠ CORS加载失败，尝试非CORS模式...');
                
                // 方案3：最后尝试不带 crossOrigin 的加载
                const image2 = new Image();
                
                image2.onload = () => {
                    console.log('✓ 图片加载成功（非CORS模式）');
                    console.log('⚠ 警告：此模式下无法下载拼图图片');
                    lastImageLoadedUrl = image2.currentSrc || url;
                    currentImageElement = image2;
                    isImageCorsEnabled = false;
                    lastImageBlobUrl = '';
                    resolve(image2);
                };
                
                image2.onerror = () => {
                    console.error('✗ 图片加载失败:', url);
                    reject(new Error('图片加载失败，请尝试其他图片源'));
                };
                
                image2.src = url;
            };
            
            image.src = url;
        });
    } catch (error) {
        throw error;
    }
}

function loadImagesFromTxt(txtUrl) {
    return fetch(txtUrl)
        .then(response => response.text())
        .then(text => {
            // 假设 txt 文件中每一行都是一个图片链接
            return text.split('\n').map(line => line.trim()).filter(line => line);
        })
        .catch(error => {
            console.error("Failed to fetch txt file:", error);
            return [];
        });
}

function hidenTip() {
    for (let i = 0; i < tipPage.length; i++) {
        tipPage[i].style.display = 'none';
    }
    // 清理礼花画布
    const existing = document.getElementById('confettiCanvas');
    if (existing && existing.parentNode) {
        existing.parentNode.removeChild(existing);
    }
    // 重置完成状态，允许继续游戏
    finished = false;
}

function isFinish() {
    for (let i = 0; i < container.childNodes.length; i++) {
        if (container.childNodes[i].dataset.index != i) {
            return false;
        }
    }
    finished = true;
    return true;
}

// 一键拼好功能：自动将所有拼图碎片按正确顺序排列
function autoSolve() {
    if (finished) {
        alert('拼图已经完成了！');
        return;
    }
    
    // 获取所有拼图碎片
    const items = Array.from(container.childNodes);
    
    // 获取网格尺寸
    let xNumber = parseInt(xNumberElement.options[xNumberElement.selectedIndex].value);
    let yNumber = parseInt(yNumberElement.options[yNumberElement.selectedIndex].value);
    
    // 按照 data-index 对碎片进行排序
    items.sort((a, b) => {
        return parseInt(a.dataset.index) - parseInt(b.dataset.index);
    });
    
    // 清空容器
    container.innerHTML = '';
    
    // 按正确的顺序重新添加碎片，并更新它们的位置数据
    items.forEach((item, index) => {
        const x = index % xNumber;
        const y = Math.floor(index / xNumber);
        item.setAttribute('data-x', x);
        item.setAttribute('data-y', y);
        container.appendChild(item);
    });
    
    // 标记为完成
    finished = true;
    
    // 触发完成动画
    setTimeout(() => {
        showTip();
    }, 300);
}

        // 礼花动画：创建画布并发射粒子
        function launchConfetti() {
            // 如果已存在则先移除
            const old = document.getElementById('confettiCanvas');
            if (old && old.parentNode) old.parentNode.removeChild(old);

            const canvas = document.createElement('canvas');
            canvas.id = 'confettiCanvas';
            canvas.style.position = 'fixed';
            canvas.style.inset = '0';
            canvas.style.pointerEvents = 'none';
            canvas.style.zIndex = '1002';
            document.body.appendChild(canvas);

            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            function resize() {
                canvas.width = Math.floor(window.innerWidth * dpr);
                canvas.height = Math.floor(window.innerHeight * dpr);
            }
            resize();
            window.addEventListener('resize', resize, { once: true });

            const colors = ['#ff5252','#ff9800','#ffd740','#69f0ae','#40c4ff','#7c4dff','#e040fb'];
            const gravity = 0.08 * dpr;
            const drag = 0.995;
            const count = Math.min(180, Math.floor(window.innerWidth / 6));
            const centerX = (canvas.width / 2);
            const centerY = (canvas.height * 2 / 3); // 起点更靠下，使礼花向上喷出

            const particles = [];
            for (let i = 0; i < count; i++) {
                const angle = -Math.PI + (Math.random() * Math.PI); // 上半圆（-π 到 0），向上方向
                const speed = (Math.random() * 12 + 8) * dpr;
                particles.push({
                    x: centerX,
                    y: centerY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 6 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * Math.PI * 2,
                    vr: (Math.random() - 0.5) * 0.2
                });
            }

            let start = null;
            function tick(ts) {
                if (!start) start = ts;
                const elapsed = ts - start;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.vy += gravity;
                    p.vx *= drag; p.vy *= drag;
                    p.x += p.vx; p.y += p.vy;
                    p.rotation += p.vr;

                    // 绘制小矩形纸片
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size/2, -p.size/3, p.size, p.size * 0.66);
                    ctx.restore();
                });

                // 1.6 秒后移除
                if (elapsed < 1600) {
                    requestAnimationFrame(tick);
                } else {
                    if (canvas && canvas.parentNode) {
                        canvas.parentNode.removeChild(canvas);
                    }
                }
            }
            requestAnimationFrame(tick);
        }
