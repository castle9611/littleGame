<script>
let container = document.getElementById('canvasContainer');
let yNumberElement = document.getElementById('yNumber');
let xNumberElement = document.getElementById('xNumber');
let tipPage = document.querySelectorAll('div.tip-page');
let imageUrlInput = document.getElementById('imageUrl'); // 保留变量以防其他地方引用（虽然已移除输入框）
let maskElement = document.querySelector('.mask.tip-page');
let lastImageOriginUrl = ''; // 记录当前拼图所用的原始图片地址（不带时间戳）
let lastImageLoadedUrl = ''; // 记录浏览器实际加载的最终图片地址（可能为跳转后的真实 URL）
let lastImageBlobUrl = '';   // 缓存当前图片的 Blob 对象 URL，下载时优先使用
// 尝试解析跳转后的最终图片 URL（若跨域不允许，可能失败）
async function resolveFinalUrl(url) {
    try {
        const res = await fetch(url, { redirect: 'follow' });
        if (res.ok) {
            // 若有跳转，res.url 为最终地址；若无跳转则为原地址
            return res.url || url;
        }
    } catch { /* 忽略错误，回退原地址 */ }
    return url;
}
// 尝试抓取图片 Blob 并缓存对象 URL（可能受 CORS 限制）
async function cacheImageBlob(url) {
    try {
        const res = await fetch(url, { redirect: 'follow' });
        if (!res.ok) throw new Error('network');
        const blob = await res.blob();
        // 释放旧的对象 URL
        if (lastImageBlobUrl) {
            try { URL.revokeObjectURL(lastImageBlobUrl); } catch {}
        }
        lastImageBlobUrl = URL.createObjectURL(blob);
    } catch {
        // 保持 lastImageBlobUrl 不变，后续下载回退到 loaded/origin URL
    }
}

let finished = false;

init();

document.getElementById('startBtn').addEventListener('click', function () {
    // 重新开始时应重置为本地图片，而不是使用之前选择的 API
    init(null); // 传入 null 确保使用默认本地图片
});

document.getElementById('okBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    e.preventDefault();
    hidenTip();
});

// 全屏功能
let isFullscreen = false;
window.isFullscreen = false; // 暴露到全局，供init函数使用
let mainContainer = document.querySelector('.main-container');
let fullscreenBtn = document.getElementById('fullscreenBtn');
let fullscreenIcon = fullscreenBtn.querySelector('i');
let fullscreenText = fullscreenBtn.querySelector('span');

// 控制面板折叠状态
let isControlsCollapsed = false;

// 折叠/展开控制面板
function toggleControls() {
    const btnContainer = document.getElementById('btnContainer');
    const inputContainer = document.querySelector('.input-container');
    const toggleBtn = document.getElementById('toggleControlsBtn');
    const toggleIcon = toggleBtn.querySelector('i');
    
    if (!isControlsCollapsed) {
        // 折叠
        btnContainer.classList.add('collapsed');
        isControlsCollapsed = true;
        toggleIcon.className = 'fas fa-chevron-down';
    } else {
        // 展开
        btnContainer.classList.remove('collapsed');
        isControlsCollapsed = false;
        toggleIcon.className = 'fas fa-chevron-up';
    }
    
    // 延迟调整布局，确保动画完成
    setTimeout(() => {
        checkAndRotate();
        adjustLayoutForFullscreen();
    }, 350);
}

// 调整全屏布局
function adjustLayoutForFullscreen() {
    if (!isFullscreen) return;
    
    const btnContainer = document.getElementById('btnContainer');
    const imageContainer = document.getElementById('canvasContainer');
    if (!imageContainer) return;
    
    // 根据控制面板状态调整拼图容器位置
    const isCollapsed = btnContainer && btnContainer.classList.contains('collapsed');
    
    // 添加类标记，方便CSS选择（CSS会处理具体的布局）
    if (isCollapsed) {
        imageContainer.classList.add('collapsed-top');
    } else {
        imageContainer.classList.remove('collapsed-top');
    }
    
    // 不再通过JS设置样式，全部由CSS控制布局和定位
    // CSS已经通过 .main-container.fullscreen-mode .image-container 处理了
}

// 检查是否需要旋转（竖屏时旋转90度，确保完整显示）
function checkAndRotate() {
    if (!isFullscreen || !mainContainer) return;
    
    const screenWidth = window.innerWidth;
    const screenHeight = window.innerHeight;
    const isPortrait = screenHeight > screenWidth;
    
    // 获取拼图的布局信息（如果已经初始化）
    const imageContainer = document.getElementById('canvasContainer');
    if (!imageContainer) return;
    
    // 获取控制面板实际高度
    const btnContainer = document.getElementById('btnContainer');
    const controlsHeight = btnContainer && btnContainer.classList.contains('collapsed') ? 40 : 80;
    
    // 可用空间（考虑控制面板高度）
    const availableWidth = screenWidth;
    const availableHeight = screenHeight - controlsHeight;
    
    // 计算横竖屏的利用率 - 选择能显示更大拼图区域的方向
    // 利用率 = min(可用宽度/拼图宽度, 可用高度/拼图高度)
    // 当竖屏时，如果旋转后能获得更大的显示面积，则旋转
    const landscapeArea = availableWidth * availableHeight;
    const portraitArea = availableHeight * availableWidth;
    
    // 如果竖屏且横屏方向能获得更大显示面积（通常竖屏设备旋转后能更好显示横图）
    // 或者竖屏时，如果可用宽度/高度比 > 0.9（接近正方形），则旋转以获得更好体验
    const aspectRatio = availableWidth / availableHeight;
    const shouldRotate = isPortrait && (
        aspectRatio < 0.85 || // 当竖屏比例明显小于1时
        (aspectRatio < 0.95 && landscapeArea > portraitArea * 1.1) // 或旋转后面积明显更大
    );
    
    if (shouldRotate) {
        mainContainer.classList.add('rotated');
    } else {
        mainContainer.classList.remove('rotated');
    }
    
    // 确保布局调整
    adjustLayoutForFullscreen();
}

// 暴露到全局，供init函数使用
window.checkAndRotate = checkAndRotate;

// 进入全屏
function enterFullscreen() {
    if (!mainContainer) return;
    
    isFullscreen = true;
    window.isFullscreen = true;
    mainContainer.classList.add('fullscreen-mode', 'auto-rotate');
    document.body.classList.add('fullscreen-active');
    
    // 重置控制面板状态（默认展开）
    isControlsCollapsed = false;
    const btnContainer = document.getElementById('btnContainer');
    if (btnContainer) {
        btnContainer.classList.remove('collapsed');
        const toggleBtn = document.getElementById('toggleControlsBtn');
        if (toggleBtn) {
            const toggleIcon = toggleBtn.querySelector('i');
            if (toggleIcon) toggleIcon.className = 'fas fa-chevron-up';
        }
    }
    
    // 更新按钮图标和文本
    fullscreenIcon.className = 'fas fa-compress';
    fullscreenText.textContent = '退出';
    
    // 检查和调整旋转（延迟以确保DOM已更新）
    setTimeout(() => {
        adjustLayoutForFullscreen();
        checkAndRotate();
        // 如果拼图已初始化，延迟重新初始化一次以适应全屏尺寸（仅一次）
        const imageContainer = document.getElementById('canvasContainer');
        const items = imageContainer && imageContainer.querySelectorAll('.item');
        if (items && items.length > 0) {
            setTimeout(() => {
                if (typeof init === 'function') {
                    init();
                }
            }, 400);
        }
    }, 100);
    
    // 监听窗口大小变化，自动调整
    window.addEventListener('resize', handleFullscreenResize);
    
    // 监听屏幕方向变化
    window.addEventListener('orientationchange', function() {
        setTimeout(() => {
            adjustLayoutForFullscreen();
            checkAndRotate();
        }, 300);
    });
}

// 退出全屏
function exitFullscreen() {
    if (!mainContainer) return;
    
    isFullscreen = false;
    window.isFullscreen = false;
    mainContainer.classList.remove('fullscreen-mode', 'auto-rotate', 'rotated');
    document.body.classList.remove('fullscreen-active');
    
    // 恢复按钮图标和文本
    fullscreenIcon.className = 'fas fa-expand';
    fullscreenText.textContent = '全屏';
    
    // 移除窗口大小监听
    window.removeEventListener('resize', handleFullscreenResize);
}

// 处理全屏时的窗口大小变化
function handleFullscreenResize() {
    if (isFullscreen) {
        // 使用防抖，避免频繁调用
        clearTimeout(handleFullscreenResize.timeoutId);
        handleFullscreenResize.timeoutId = setTimeout(() => {
            adjustLayoutForFullscreen();
            checkAndRotate();
        }, 150);
    }
}

// 全屏按钮点击事件
fullscreenBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (isFullscreen) {
        exitFullscreen();
    } else {
        enterFullscreen();
    }
});

// 折叠按钮点击事件（只在全屏模式下可用）
const toggleControlsBtn = document.getElementById('toggleControlsBtn');
if (toggleControlsBtn) {
    // 默认隐藏折叠按钮（非全屏模式）
    toggleControlsBtn.style.display = 'none';
    
    toggleControlsBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (isFullscreen) {
            toggleControls();
        }
    });
}

// 监听浏览器全屏API变化（如果用户用ESC退出全屏）
document.addEventListener('fullscreenchange', function() {
    // 如果浏览器全屏退出，但我们的全屏模式还在，则退出我们的全屏模式
    if (!document.fullscreenElement && isFullscreen) {
        exitFullscreen();
    }
});

document.addEventListener('webkitfullscreenchange', function() {
    if (!document.webkitFullscreenElement && isFullscreen) {
        exitFullscreen();
    }
});

document.addEventListener('mozfullscreenchange', function() {
    if (!document.mozFullScreenElement && isFullscreen) {
        exitFullscreen();
    }
});

document.addEventListener('MSFullscreenChange', function() {
    if (!document.msFullscreenElement && isFullscreen) {
        exitFullscreen();
    }
});
const downloadBtnEl = document.getElementById('downloadImgBtn');
if (downloadBtnEl) {
    downloadBtnEl.addEventListener('click', async function (e) {
        e.stopPropagation();
        e.preventDefault();
        
        // 下载优先级：Blob 对象 URL > 实际加载的最终地址 > 原始地址
        let urlToDownload = lastImageBlobUrl || lastImageLoadedUrl || lastImageOriginUrl;
        if (!urlToDownload) {
            alert('当前没有可下载的图片');
            return;
        }
        
        try {
            // 如果使用 Blob URL，直接下载
            if (lastImageBlobUrl) {
                const link = document.createElement('a');
                link.href = lastImageBlobUrl;
                link.download = 'puzzle-image.jpg';
                link.style.display = 'none';
                document.body.appendChild(link);
                link.click();
                setTimeout(() => {
                    document.body.removeChild(link);
                }, 100);
                return;
            }
            
            // 否则尝试通过 fetch 获取图片（处理跨域）
            try {
                const response = await fetch(urlToDownload, { 
                    mode: 'cors',
                    redirect: 'follow'
                });
                if (response.ok) {
                    const blob = await response.blob();
                    const blobUrl = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = blobUrl;
                    link.download = 'puzzle-image.jpg';
                    link.style.display = 'none';
                    document.body.appendChild(link);
                    link.click();
                    setTimeout(() => {
                        document.body.removeChild(link);
                        URL.revokeObjectURL(blobUrl);
                    }, 100);
                } else {
                    throw new Error('Fetch failed');
                }
            } catch (fetchError) {
                // 如果 fetch 失败（跨域限制），尝试直接打开链接
                const link = document.createElement('a');
                link.href = urlToDownload;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.style.display = 'none';
                document.body.appendChild(link);
                link.click();
                setTimeout(() => {
                    document.body.removeChild(link);
                }, 100);
            }
        } catch (error) {
            console.error('下载失败:', error);
            alert('下载失败，请尝试右键图片另存为');
        }
    });
}

function init(imageUrl) {
    let xNumber = xNumberElement.options[xNumberElement.selectedIndex].value; // 列数
    let yNumber = yNumberElement.options[yNumberElement.selectedIndex].value; // 行数
    let itemList = [];
    let order = 0;
    let img = null;
    let cellWidth, cellHeight, imageCellWidth, imageCellHeight;
    container.innerHTML = ''; // 清空容器
    finished = false;

    getRotateImage(imageUrl).then((image) => {
        img = image;
        
        let fixedHeight = 580;
        let imageWidth = img.width;
        let imageHeight = img.height;
        let scaledWidth, scale;

        // 检查是否处于全屏模式
        const isFullscreen = mainContainer.classList.contains('fullscreen-mode');
        
        if (isFullscreen) {
            // 全屏模式下，根据窗口可用空间自适应计算尺寸
            const btnContainer = document.getElementById('btnContainer');
            const controlsHeight = btnContainer && btnContainer.classList.contains('collapsed') ? 40 : 80;
            const isRotated = mainContainer.classList.contains('rotated');
            
            // 如果旋转了，宽高要互换（因为旋转后，窗口的宽变成高，高变成宽）
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            const availableWidth = isRotated ? (screenHeight - controlsHeight - 40) : (screenWidth - 40);
            const availableHeight = isRotated ? (screenWidth - 40) : (screenHeight - controlsHeight - 40);
            
            // 计算适合可用空间的缩放比例，保持图片宽高比
            const scaleByWidth = availableWidth / imageWidth;
            const scaleByHeight = availableHeight / imageHeight;
            scale = Math.min(scaleByWidth, scaleByHeight);
            
            // 计算缩放后的尺寸
            scaledWidth = Math.floor(imageWidth * scale);
            fixedHeight = Math.floor(imageHeight * scale);
        } else {
            // 非全屏模式，使用固定高度
            scale = fixedHeight / imageHeight;
            scaledWidth = Math.floor(imageWidth * scale);
        }

        // 计算每个单元格的宽高（根据缩放后的尺寸）
        cellWidth = Math.floor(scaledWidth / xNumber);
        cellHeight = Math.floor(fixedHeight / yNumber);

        // 更新容器的宽度和高度
        // 无论是否全屏，都需要设置容器尺寸以便grid布局正确工作
        container.style.width = `${scaledWidth}px`;
        container.style.height = `${fixedHeight}px`;

        // 计算图片在每个单元格中显示的部分尺寸
        imageCellWidth = Math.floor(img.width / xNumber);
        imageCellHeight = Math.floor(img.height / yNumber);

        // 使用 grid 布局
        container.style['grid-template-columns'] = `repeat(${xNumber}, ${cellWidth}px)`;
        container.style['grid-template-rows'] = `repeat(${yNumber}, ${cellHeight}px)`;

        for (let j = 0; j < yNumber; j++) {
            itemList[j] = [];
            for (let i = 0; i < xNumber; i++) {
                initCube(i, j);
            }
        }
        moveCube();
    });

    function initCube(i, j) {
        let item = document.createElement('div');
        item.className = 'item';
        item.setAttribute('data-index', order);
        item.draggable = 'true';
        // 使用 drag.js 中的函数添加拖动事件监听器
        attachDragListeners(item);
        item.innerHTML = "<canvas class='' width='" + cellWidth + "' height='" + cellHeight + "'></canvas>";
        itemList[j][i] = item;

        let canvas = item.querySelector('canvas');
        let ctx = canvas.getContext('2d');

        // 将图片的指定区域绘制到 canvas 上
        ctx.drawImage(
            img,
            i * imageCellWidth, j * imageCellHeight, // 图片的起点位置
            imageCellWidth, imageCellHeight,        // 图片区域大小
            0, 0,                                   // 画布的起点
            cellWidth, cellHeight                   // 画布显示的大小
        );
        order++;
    }

    function moveCube() {
        let randomChange = [-1, 1];
        const changeCount = 5;
        for (let j = 0; j < yNumber; j++) {
            const maxIndex = xNumber - 1;
            for (let m = 0; m < changeCount; m++) {
                let sourceIndex = getRandomInt(xNumber);
                let targetIndex = getTargetIndex(sourceIndex, maxIndex);
                itemList[j][sourceIndex] = itemList[j].splice(targetIndex, 1, itemList[j][sourceIndex])[0];
            }
        }
        for (let i = 0; i < xNumber; i++) {
            const maxIndex = yNumber - 1;
            for (let m = 0; m < changeCount; m++) {
                let sourceIndex = getRandomInt(yNumber);
                let targetIndex = getTargetIndex(sourceIndex, maxIndex);
                itemList[sourceIndex][i] = itemList[targetIndex].splice(i, 1, itemList[sourceIndex][i])[0];
            }
        }
        for (let j = 0; j < itemList.length; j++) {
            for (let i = 0; i < itemList[j].length; i++) {
                itemList[j][i].setAttribute('data-x', i);
                itemList[j][i].setAttribute('data-y', j);
                container.appendChild(itemList[j][i]);
            }
        }

        function getTargetIndex(sourceIndex, maxIndex) {
            return sourceIndex === 0 ? 1 : sourceIndex === maxIndex ? maxIndex - 1 : sourceIndex + randomChange[getRandomInt(randomChange.length)];
        }
        
        // 如果处于全屏模式，初始化完成后重新检查旋转
        setTimeout(() => {
            if (window.isFullscreen && typeof window.checkAndRotate === 'function') {
                window.checkAndRotate();
            }
        }, 300);
    }
}




function loadImagesFromTxt(txtUrl) {
    return fetch(txtUrl)
        .then(response => response.text())
        .then(text => {
            // 假设 txt 文件中每一行都是一个图片链接
            let imageUrls = text.split('\n').map(line => line.trim()).filter(line => line);
            return imageUrls;
        })
        .catch(error => {
            console.error("无法获取 txt 文件：", error);
            return [];
        });
}

let currentImageIndex = 0;  // 用于追踪当前显示的图片索引

// 辅助函数：正确添加查询参数到URL（处理已有查询参数的情况）
function addQueryParam(url, paramName, paramValue) {
    const separator = url.includes('?') ? '&' : '?';
    return `${url}${separator}${paramName}=${paramValue}`;
}

function getRotateImage(imageUrl) {
    let image = new Image();
    // 如果提供了URL参数且不为null，则使用；否则使用默认本地图片
    // imageUrl 为 null 或 undefined 时，使用默认本地图片
    let inputUrl = (imageUrl !== null && imageUrl !== undefined) ? imageUrl.trim() : '';

    if (inputUrl && inputUrl.startsWith("txt:")) {
        // 处理 txt 文件链接
        let txtUrl = inputUrl.replace("txt:", "");
        return loadImagesFromTxt(txtUrl).then(imageUrls => {
            if (imageUrls.length > 0) {
                // 确保当前索引不超出范围
                currentImageIndex = (currentImageIndex + 1) % imageUrls.length;
                let imageUrl = imageUrls[currentImageIndex];
                
                // 记录原始地址，并添加时间戳和随机数以防缓存
                lastImageOriginUrl = imageUrl;
                let timestamp = new Date().getTime();
                let randomNum = Math.random().toString(36).substring(7);
                let urlWithTimestamp = addQueryParam(addQueryParam(imageUrl, 'timestamp', timestamp), 'rand', randomNum);
                // 先尝试解析最终 URL（避免再次命中随机 API）
                resolveFinalUrl(urlWithTimestamp).then(finalUrl => {
                    image.src = finalUrl;
                    // 并尝试缓存 Blob 对象 URL（若跨域允许）
                    cacheImageBlob(finalUrl);
                });
                return new Promise((resolve, reject) => {
                    image.onload = () => {
                        // 记录最终地址；若解析失败则用 currentSrc/带时间戳的地址
                        lastImageLoadedUrl = image.currentSrc || urlWithTimestamp;
                        resolve(image);
                    };
                    image.onerror = reject;
                });
            } else {
                return Promise.reject("在 txt 文件中未找到图像。");
            }
        });
    } else {
        // 如果不是 txt 文件，直接使用图片 URL（如果没有提供或为 null/undefined，则使用默认本地图片）
        let imageUrl = inputUrl || './img/demo.jpg';
        // 记录原始地址，并添加时间戳和随机数以防缓存（确保每次获取不同图片，特别是随机API）
        lastImageOriginUrl = imageUrl;
        let timestamp = new Date().getTime();
        let randomNum = Math.random().toString(36).substring(7);
        // 使用辅助函数正确添加参数（处理URL已包含查询参数的情况）
        let urlWithTimestamp = addQueryParam(addQueryParam(imageUrl, '_t', timestamp), '_r', randomNum);
        // 先尝试解析最终 URL 并赋值，同时尝试缓存 Blob
        resolveFinalUrl(urlWithTimestamp).then(finalUrl => {
            image.src = finalUrl;
            cacheImageBlob(finalUrl);
        });
        // 注意：最终地址在 onload 中通过 currentSrc 记录
        return new Promise((resolve, reject) => {
            image.onload = () => resolve(image);
            image.onerror = reject;
        });
    }
}

function loadImagesFromTxt(txtUrl) {
    return fetch(txtUrl)
        .then(response => response.text())
        .then(text => {
            // 假设 txt 文件中每一行都是一个图片链接
            return text.split('\n').map(line => line.trim()).filter(line => line);
        })
        .catch(error => {
            console.error("Failed to fetch txt file:", error);
            return [];
        });
}

        // 礼花动画：创建画布并发射粒子
        function launchConfetti() {
            // 如果已存在则先移除
            const old = document.getElementById('confettiCanvas');
            if (old && old.parentNode) old.parentNode.removeChild(old);

            const canvas = document.createElement('canvas');
            canvas.id = 'confettiCanvas';
            canvas.style.position = 'fixed';
            canvas.style.inset = '0';
            canvas.style.pointerEvents = 'none';
            canvas.style.zIndex = '1002';
            document.body.appendChild(canvas);

            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            function resize() {
                canvas.width = Math.floor(window.innerWidth * dpr);
                canvas.height = Math.floor(window.innerHeight * dpr);
            }
            resize();
            window.addEventListener('resize', resize, { once: true });

            const colors = ['#ff5252','#ff9800','#ffd740','#69f0ae','#40c4ff','#7c4dff','#e040fb'];
            const gravity = 0.08 * dpr;
            const drag = 0.995;
            const count = Math.min(180, Math.floor(window.innerWidth / 6));
            const centerX = (canvas.width / 2);
            const centerY = (canvas.height * 2 / 3); // 起点更靠下，使礼花向上喷出

            const particles = [];
            for (let i = 0; i < count; i++) {
                const angle = -Math.PI + (Math.random() * Math.PI); // 上半圆（-π 到 0），向上方向
                const speed = (Math.random() * 12 + 8) * dpr;
                particles.push({
                    x: centerX,
                    y: centerY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 6 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * Math.PI * 2,
                    vr: (Math.random() - 0.5) * 0.2
                });
            }

            let start = null;
            function tick(ts) {
                if (!start) start = ts;
                const elapsed = ts - start;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.vy += gravity;
                    p.vx *= drag; p.vy *= drag;
                    p.x += p.vx; p.y += p.vy;
                    p.rotation += p.vr;

                    // 绘制小矩形纸片
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size/2, -p.size/3, p.size, p.size * 0.66);
                    ctx.restore();
                });

                // 1.6 秒后移除
                if (elapsed < 1600) {
                    requestAnimationFrame(tick);
                } else {
                    if (canvas && canvas.parentNode) {
                        canvas.parentNode.removeChild(canvas);
                    }
                }
            }
            requestAnimationFrame(tick);
        }
