<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sheepGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="fluffGradient">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f3f5;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- 羊身体（云朵状） -->
  <ellipse cx="32" cy="34" rx="18" ry="14" fill="url(#sheepGradient)" stroke="#dee2e6" stroke-width="1.5"/>
  
  <!-- 毛绒效果 -->
  <circle cx="20" cy="28" r="6" fill="url(#fluffGradient)" stroke="#dee2e6" stroke-width="1"/>
  <circle cx="28" cy="24" r="7" fill="url(#fluffGradient)" stroke="#dee2e6" stroke-width="1"/>
  <circle cx="36" cy="24" r="7" fill="url(#fluffGradient)" stroke="#dee2e6" stroke-width="1"/>
  <circle cx="44" cy="28" r="6" fill="url(#fluffGradient)" stroke="#dee2e6" stroke-width="1"/>
  <circle cx="24" cy="36" r="5" fill="url(#fluffGradient)" stroke="#dee2e6" stroke-width="1"/>
  <circle cx="40" cy="36" r="5" fill="url(#fluffGradient)" stroke="#dee2e6" stroke-width="1"/>
  
  <!-- 羊头 -->
  <ellipse cx="32" cy="20" rx="8" ry="9" fill="#2d3436" stroke="#2d3436" stroke-width="1"/>
  
  <!-- 耳朵 -->
  <ellipse cx="26" cy="16" rx="3" ry="4" fill="#2d3436"/>
  <ellipse cx="38" cy="16" rx="3" ry="4" fill="#2d3436"/>
  
  <!-- 眼睛 -->
  <circle cx="29" cy="20" r="2" fill="#fff"/>
  <circle cx="35" cy="20" r="2" fill="#fff"/>
  <circle cx="29.5" cy="20" r="1" fill="#2d3436"/>
  <circle cx="35.5" cy="20" r="1" fill="#2d3436"/>
  
  <!-- 鼻子 -->
  <ellipse cx="32" cy="24" rx="1.5" ry="1" fill="#495057"/>
  
  <!-- 腿 -->
  <rect x="22" y="44" width="3" height="10" rx="1.5" fill="#2d3436"/>
  <rect x="29" y="44" width="3" height="10" rx="1.5" fill="#2d3436"/>
  <rect x="36" y="44" width="3" height="10" rx="1.5" fill="#2d3436"/>
  <rect x="43" y="44" width="3" height="10" rx="1.5" fill="#2d3436"/>
  
  <!-- 蹄子 -->
  <ellipse cx="23.5" cy="54" rx="2" ry="1.5" fill="#495057"/>
  <ellipse cx="30.5" cy="54" rx="2" ry="1.5" fill="#495057"/>
  <ellipse cx="37.5" cy="54" rx="2" ry="1.5" fill="#495057"/>
  <ellipse cx="44.5" cy="54" rx="2" ry="1.5" fill="#495057"/>
</svg>
