    <rect x="2" y="0" width="2" height="8" rx="0.5" fill="#fff" opacity="0.9"/>
    <rect x="0" y="2" width="6" height="2" rx="0.5" fill="#fff" opacity="0.9"/>
  </g>
  
  <!-- 按钮 -->
  <circle cx="46" cy="28" r="2" fill="#fff" opacity="0.9"/>
